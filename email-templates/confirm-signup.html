<!-- Supabase → Authentication → Emails → Templates → "Confirm sign up"
     Subject:  Your Eko TransitCare verification code
     Paste everything below into the template box. {{ .Token }} is the 6-digit code. -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;background:#f5f7fb;">
  <div style="background:#0b1f5c;color:#ffffff;padding:18px 22px;border-radius:12px 12px 0 0;">
    <strong style="font-size:18px;">🚌 Eko TransitCare</strong>
  </div>
  <div style="background:#ffffff;padding:26px 22px;border-radius:0 0 12px 12px;border:1px solid #e3e7f0;border-top:none;">
    <p style="margin:0 0 12px;font-size:15px;color:#1b2440;">Hello,</p>
    <p style="margin:0 0 18px;font-size:15px;color:#1b2440;">Use this code to verify your email and finish creating your account:</p>
    <p style="margin:0 0 18px;text-align:center;font-size:34px;letter-spacing:10px;font-weight:800;color:#0b1f5c;">{{ .Token }}</p>
    <p style="margin:0 0 8px;font-size:13px;color:#5a6480;">The code expires in 10 minutes. Never share it with anyone, and we will never ask you for it by phone or chat.</p>
    <p style="margin:0;font-size:13px;color:#5a6480;">If you did not create an Eko TransitCare account, you can ignore this email.</p>
  </div>
</div>
